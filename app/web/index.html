<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Ask Atharva</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23a98bf5'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='36' text-anchor='middle' fill='%2315132b'%3EA%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
      <symbol id="i-clip" viewBox="0 0 24 24"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7l8.5-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.3-2.3L16 7"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16Z"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3c.6 4.6 3.4 7.4 8 8-4.6.6-7.4 3.4-8 8-.6-4.6-3.4-7.4-8-8 4.6-.6 7.4-3.4 8-8Z"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.5H9v5.5H5.5A1.5 1.5 0 0 1 4 19Z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
      <symbol id="cat-mark" viewBox="0 0 100 100">
        <path d="M16 50 L17 17 Q18 10 24 14 L39 27 Q50 24 61 27 L76 14 Q82 10 83 17 L84 50 Q85 80 50 85 Q15 80 16 50Z" fill="#1b2a3b"/>
        <g class="cat-eye"><path d="M24 50 H44 Q43 60 34 60 Q25 60 24 50Z" fill="#f59a23"/><path d="M34 51 V58" stroke="#16202c" stroke-width="2.4" stroke-linecap="round"/></g>
        <g class="cat-eye"><path d="M56 50 H76 Q75 60 66 60 Q57 60 56 50Z" fill="#f59a23"/><path d="M66 51 V58" stroke="#16202c" stroke-width="2.4" stroke-linecap="round"/></g>
        <path d="M46.5 64 H53.5 L50 68Z" fill="#0c141d"/>
        <g stroke="#8fa6ba" stroke-width="1.6" stroke-linecap="round" fill="none"><path d="M18 62 L3 59"/><path d="M18 67 L4 70"/><path d="M82 62 L97 59"/><path d="M82 67 L96 70"/></g>
      </symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    </svg>

    <div class="app">
      <aside class="rail" aria-label="Main">
        <a class="brand" href="#/today"><span class="brand-mark"><svg class="mk" aria-hidden="true"><use href="#cat-mark"/></svg></span><span class="brand-name" id="brand-name">Ask Atharva</span></a>
        <nav class="rail-nav">
          <a href="#/today"><svg class="i"><use href="#i-home"/></svg><span>Home</span></a>
          <a href="#/chat"><svg class="i"><use href="#i-chat"/></svg><span>Chat</span></a>
          <a href="#/todos"><svg class="i"><use href="#i-list"/></svg><span>Todos</span></a>
          <a href="#/calendar"><svg class="i"><use href="#i-cal"/></svg><span>Calendar</span></a>
          <a href="#/files"><svg class="i"><use href="#i-file"/></svg><span>Files</span></a>
        </nav>
        <div class="rail-foot">
          <a class="rail-me" href="#/settings" aria-label="Your profile"><span class="me-av" id="rail-av">A</span><span id="rail-name"></span></a>
          <nav class="rail-nav"><a href="#/settings"><svg class="i"><use href="#i-gear"/></svg><span>Settings</span></a></nav>
          <div class="rail-status" id="rail-status"><span class="dot"></span><span>Checking…</span></div>
        </div>
      </aside>
      <div class="content">
      <header class="appbar">
        <a class="avatar-btn" id="avatar" href="#/settings" aria-label="Settings"><span id="avatar-letter">A</span><i class="badge"></i></a>
        <div class="hello-line"><b id="hello-name">Hello</b><span id="hello-date"></span></div>
        <a class="round-btn" href="#/chat" aria-label="Ask a question"><svg class="i"><use href="#i-search"/></svg></a>
      </header>
      <main id="app" tabindex="-1"></main>
      </div>
    </div>

    <nav class="tabbar" aria-label="Main">
      <a href="#/today" aria-label="Home"><svg class="i"><use href="#i-home"/></svg><span>Home</span></a>
      <a href="#/chat" aria-label="Chat"><svg class="i"><use href="#i-chat"/></svg><span>Chat</span></a>
      <a href="#/todos" aria-label="Todos"><svg class="i"><use href="#i-list"/></svg><span>Todos</span></a>
      <a href="#/calendar" aria-label="Calendar"><svg class="i"><use href="#i-cal"/></svg><span>Calendar</span></a>
      <a href="#/files" aria-label="Files"><svg class="i"><use href="#i-file"/></svg><span>Files</span></a>
    </nav>

    <div class="toasts" aria-live="polite" id="toasts"></div>
    <dialog id="event-sheet" class="sheet" aria-labelledby="sheet-title">
      <form id="event-form" class="stack" method="dialog" novalidate>
        <div class="sheet-grip" aria-hidden="true"></div>
        <h2 id="sheet-title">New event</h2>
        <label class="field"><span>What</span><input class="input" name="title" maxlength="200" placeholder="Lunch with Riya" autocomplete="off" required></label>
        <div class="row2">
          <label class="field"><span>Day</span><input class="input" type="date" name="date" required></label>
          <label class="field toggle"><span>All day</span><input type="checkbox" name="all_day" role="switch"><i aria-hidden="true"></i></label>
        </div>
        <div class="row2" id="timed-row">
          <label class="field"><span>Starts</span><input class="input" type="time" name="time"></label>
          <label class="field"><span>Length</span><select class="input" name="duration"><option value="15">15 min</option><option value="30">30 min</option><option value="45">45 min</option><option value="60">1 hour</option><option value="90">1.5 hours</option><option value="120">2 hours</option><option value="180">3 hours</option></select></label>
        </div>
        <label class="field"><span>Where (optional)</span><input class="input" name="location" maxlength="200" placeholder="Room A2, Zoom…" autocomplete="off"></label>
        <label class="field"><span>Notes (optional)</span><textarea class="input" name="notes" rows="2" maxlength="2000"></textarea></label>
        <div class="row" style="justify-content:space-between">
          <button class="btn danger" type="button" id="event-delete" hidden>Delete</button>
          <span class="row" style="margin-left:auto"><button class="btn ghost" type="button" id="event-cancel">Cancel</button><button class="btn">Save</button></span>
        </div>
      </form>
    </dialog>
    <dialog id="photo-dialog" class="sheet photo-sheet" aria-labelledby="photo-title">
      <div class="stack" style="justify-items:center;text-align:center">
        <div class="sheet-grip" aria-hidden="true"></div>
        <h2 id="photo-title">Your photo</h2>
        <p class="muted small" style="margin:-8px 0 0">Drag to move it, slide to zoom.</p>
        <canvas id="photo-canvas" width="320" height="320" aria-label="Photo preview"></canvas>
        <label class="field" style="width:min(320px,100%)"><span class="sr-only">Zoom</span><input id="photo-zoom" class="zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="Zoom"></label>
        <div class="row" style="justify-content:center"><button class="btn ghost" type="button" id="photo-cancel">Cancel</button><button class="btn" type="button" id="photo-save">Save photo</button></div>
      </div>
    </dialog>
    <dialog id="confirm">
      <h2 id="confirm-title"></h2>
      <p class="muted" id="confirm-body"></p>
      <div class="row" style="justify-content:flex-end;margin-top:18px">
        <button class="btn ghost" value="cancel" id="confirm-cancel">Keep it</button>
        <button class="btn danger" id="confirm-ok">Delete</button>
      </div>
    </dialog>
    <input type="file" id="file-picker" hidden accept=".xlsx,.xlsm,.csv,.txt,.md,.vtt,.srt" />
    <script src="/assets/app.js" defer></script>
  </body>
</html>
