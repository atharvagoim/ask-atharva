[project]
name = "ask-atharva"
version = "2.0.0"
description = "Ask Atharva — a calm personal productivity assistant: todos, calendar, files, slides and meeting notes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pymongo>=4.7",
    "dnspython>=2.6",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langchain-openai>=0.2",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "matplotlib>=3.8",
    "pillow>=10",
    "dateparser>=1.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "mongomock>=4.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
